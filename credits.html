<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>DIGspotlight Credits</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
  overflow: hidden;
}

#wrapper {
  position: absolute;
  width: 100%;
  top: 100%;
}

#track {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 60px;
  font-size: 22px;
}

/* ストリーマーブロック */
.credit-block {
  text-align: center;
}

/* ヘッダー（アイコン＋名前） */
.streamer-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 10px;
}

.streamer-header img {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  background: #222;
}

.streamer-name {
  font-size: 26px;
  font-weight: bold;
}

/* ゲーム一覧 */
.game-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  max-width: 800px;
}

.game-item {
  width: 220px;
}

.game-item img {
  width: 100%;
  border-radius: 6px;
}

.game-title {
  font-size: 14px;
  opacity: 0.8;
}

/* スクロール */
.scroll {
  animation: scrollCredits linear infinite;
}

@keyframes scrollCredits {
  from { transform: translateY(0); }
  to { transform: translateY(-100%); }
}
</style>
</head>

<body>

<div id="wrapper">
  <div id="track"></div>
</div>

<script>
const csv_url = "https://docs.google.com/spreadsheets/d/17mMvupAwNM2ssbHjiHhXNRfUujoXQYeXgkSAQjL6G-g/export?format=csv";

const getValue = (row, keyword) => {
  const key = Object.keys(row).find(k => k && k.includes(keyword));
  return key ? row[key] : "";
};

const track = document.getElementById("track");
const wrapper = document.getElementById("wrapper");

// Twitchユーザー名抽出
function getUsername(twitch) {
  if (!twitch) return "";
  return twitch
    .replace("https://www.twitch.tv/", "")
    .replace("https://twitch.tv/", "")
    .split("?")[0]
    .replace("/", "")
    .toLowerCase();
}

// AppID
function getAppId(url) {
  return url.match(/app\/(\d+)/)?.[1];
}

fetch(csv_url)
.then(res => res.text())
.then(text => {

  const parsed = Papa.parse(text, { header: true });
  const data = parsed.data;

  const validData = data.filter(row => {
    const game = getValue(row, "Game");
    return game && game.trim() !== "";
  });

  // ===== ストリーマーごとにまとめる =====
  const map = {};

  validData.forEach(row => {
    const streamer = getValue(row, "Streamer");
    const twitch = getValue(row, "Twitch");
    const game = getValue(row, "Game");
    const steam = getValue(row, "Steam");

    const username = getUsername(twitch);

    if (!map[username]) {
      map[username] = {
        streamer,
        username,
        games: []
      };
    }

    map[username].games.push({
      game,
      steam
    });
  });

  const grouped = Object.values(map);

  // ===== タイトル =====
  const title = document.createElement("div");
  title.innerHTML = "<h2>Thank you for participating</h2>";
  track.appendChild(title);

  // ===== 描画 =====
  grouped.forEach(user => {

    const block = document.createElement("div");
    block.className = "credit-block";

    const icon = user.username
      ? `icons/${user.username}.png`
      : "";

    const header = `
      <div class="streamer-header">
        <img src="${icon}" onerror="this.src='https://placehold.co/50x50?text=?'">
        <div class="streamer-name">${user.streamer}</div>
      </div>
    `;

    const gamesHTML = user.games.map(g => {
      const appId = getAppId(g.steam);
      const img = appId ? `images/${appId}.jpg` : "";

      return `
        <div class="game-item">
          <img src="${img}" onerror="this.style.display='none'">
          <div class="game-title">${g.game}</div>
        </div>
      `;
    }).join("");

    block.innerHTML = `
      ${header}
      <div class="game-list">${gamesHTML}</div>
    `;

    track.appendChild(block);
  });

  // ===== ループ =====
  const clone = track.cloneNode(true);
  track.appendChild(clone);

  // ===== 高さベースで速度決定 =====
  requestAnimationFrame(() => {
    const height = track.scrollHeight / 2; // 元データ分だけ
    const speed = 50; // px/sec（調整ポイント）

    const duration = height / speed;

    wrapper.style.animationDuration = duration + "s";
    wrapper.classList.add("scroll");
  });

})
.catch(err => {
  console.error("CSV取得失敗:", err);
});
</script>

</body>
</html>
