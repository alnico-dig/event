<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>#DIGspotlight Credits</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
  overflow: hidden;
}

#wrapper {
  position: absolute;
  width: 100%;
  top: 100%;
}

#track {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 60px;
  font-size: 22px;
}

.credit-block {
  text-align: center;
}

.streamer-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 10px;
}

.streamer-header img {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  background: #222;
}

.streamer-name {
  font-size: 26px;
  font-weight: bold;
}

.game-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  max-width: 800px;
}

.game-item {
  width: 300px;
}

.game-item img {
  width: 100%;
  border-radius: 6px;
}

.game-title {
  font-size: 16px;
  opacity: 0.8;
}

.scroll {
  animation: scrollCredits linear;
}

@keyframes scrollCredits {
  from { transform: translateY(0); }
  to { transform: translateY(calc(-1 * var(--scroll-distance))); }
}
</style>
<!-- 一覧を公開用スプレッドシートのCSVから読むためのパーサー（PUBLIC_SHEET_ID未設定時は未使用） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>

<body>

<div id="wrapper">
  <div id="track"></div>
</div>

<script>
// index.html・schedule.htmlと同じGAS Webアプリ（?list=1は公開安全な列のみを返す・フォールバック用）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyT9pn4WAGQZ6xVM1i0LDCTrq3gWxF1EdEY0L1yFk1J7AsfUvhyG4AYt54Y7Mn2w82f/exec';
// 公開用スプレッドシート（gas_script.js の CONFIG.publicSheetId・index.html/schedule.htmlと共通）が
// 設定済みならそちらを直CSVで読む。未設定の間はGAS(?list=1)にフォールバックする。
const PUBLIC_SHEET_ID = '1DefWp9Xl6xsvXEoEkDF2ikpB0Lhy0rVfZ7PH-9Jn1s0';
const PUBLIC_SHEET_CSV_URL = PUBLIC_SHEET_ID
  ? 'https://docs.google.com/spreadsheets/d/' + PUBLIC_SHEET_ID + '/export?format=csv'
  : '';

const escapeHtml = str => {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
};

const track = document.getElementById("track");
const wrapper = document.getElementById("wrapper");

function fetchWithTimeout(url, timeoutMs) {
  return Promise.race([
    fetch(url),
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), timeoutMs))
  ]);
}

function fetchListData() {
  if (PUBLIC_SHEET_CSV_URL) {
    return fetchWithTimeout(PUBLIC_SHEET_CSV_URL, 15000)
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(text => new Promise((resolve, reject) => {
        Papa.parse(text, {
          header: true,
          skipEmptyLines: true,
          complete: result => resolve(result.data),
          error: reject
        });
      }));
  }
  return fetchWithTimeout(GAS_URL + '?list=1', 22000)
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(json => json.entries || []);
}

function loadCredits(attempt) {
  attempt = attempt || 1;
  fetchListData().then(renderCredits).catch(err => {
    console.error('一覧の取得に失敗 (try ' + attempt + '):', err);
    if (attempt < 4) { setTimeout(() => loadCredits(attempt + 1), 2500); }
  });
}

function renderCredits(rows) {

  const validData = (rows || []).filter(row => {
    const game = row.Game;
    return game && String(game).trim() !== "";
  });

  // ===== ストリーマーごとにまとめる =====
  const map = {};

  validData.forEach(row => {
    const login = String(row.TwitchLogin || "").toLowerCase();

    if (!map[login]) {
      map[login] = {
        streamer: row.Streamer,
        icon: row.IconUrl,
        games: []
      };
    }

    map[login].games.push({
      game: row.Game,
      header: row.HeaderImage
    });
  });

  const grouped = Object.values(map);

  // ===== 描画 =====
  grouped.forEach(user => {

    const block = document.createElement("div");
    block.className = "credit-block";

    const icon = user.icon || "";

    const header = `
      <div class="streamer-header">
        <img src="${icon}" onerror="this.src='https://placehold.co/50x50?text=?'">
        <div class="streamer-name">${escapeHtml(user.streamer)}</div>
      </div>
    `;

    const gamesHTML = user.games.map(g => {
      const img = g.header || "";

      return `
        <div class="game-item">
          <img src="${img}" onerror="this.style.display='none'">
          <div class="game-title">${escapeHtml(g.game)}</div>
        </div>
      `;
    }).join("");

    block.innerHTML = `
      ${header}
      <div class="game-list">${gamesHTML}</div>
    `;

    track.appendChild(block);
  });

  // ===== エンディング =====
  const ending = document.createElement("div");
  ending.className = "credit-block";
  ending.style.marginTop = "80px";

  ending.innerHTML = `
    <div style="font-size:28px; font-weight:bold; margin-bottom:20px;">
      Thank you for watching & supporting!!<br>
      and all streamers & developers!!<br><br>
      Presented by alnico
    </div>
  `;

  track.appendChild(ending);
  
  function waitForImages() {
    const images = track.querySelectorAll("img");
    let loaded = 0;

    if (images.length === 0) {
      startMeasurement();
      return;
    }

    images.forEach(img => {
      if (img.complete) {
        loaded++;
      } else {
        img.onload = img.onerror = () => {
          loaded++;
          if (loaded === images.length) {
            startMeasurement();
          }
        };
      }
    });

    if (loaded === images.length) {
      startMeasurement();
    }
  }

  function startMeasurement() {
    const contentHeight = track.scrollHeight;
    const screenHeight = window.innerHeight;

    const totalDistance = contentHeight + screenHeight;

    const speed = 50; // px/sec
    const duration = totalDistance / speed;

    wrapper.style.animationDuration = duration + "s";
    wrapper.style.setProperty("--scroll-distance", totalDistance + "px");

    startScroll();
  }

  waitForImages();

  function startScroll() {
    wrapper.classList.remove("scroll");

    // 再スタートのために強制リフロー
    void wrapper.offsetWidth;

    wrapper.classList.add("scroll");
  }

  // 1周ごとにリセット
  wrapper.addEventListener("animationend", () => {
    setTimeout(startScroll, 1500); // 1.5秒休憩
  });

}

loadCredits();
</script>

</body>
</html>
